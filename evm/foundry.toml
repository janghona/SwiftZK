[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Allow tests to read exported proof calldata from ./data
fs_permissions = [
    { access = "read", path = "./data" },
    { access = "read", path = "../proofs" },
]
gas_reports = ["*"]

[fmt]
line_length = 100
