[workspace]
resolver = "2"
members = [
    "crates/zkbench-core",
    "crates/zkbench-prover",
    "crates/zkbench-verifier",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
peak_alloc = "0.2"

# Release profile used for ALL benchmark builds (Experiments 1 and 3).
# Record these flags in the paper's reproducibility block.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
